<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <!-- 讓網頁在手機上使用正確寬度顯示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#FBFAF6">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>附近飲料店隨機選店助手</title>

  <!-- 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  <!-- 引入 CSS 檔案 -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <header class="app-header">
      <h1 class="app-title">選飲料</h1>
      <p class="app-subtitle"></p>
    </header>

    <main>
      <section id="store-list-page" class="page page--active">

        <!-- 距離範圍選擇按鈕 -->
        <div class="distance-filter" id="distance-filter" role="group" aria-label="選擇距離範圍">
          <button type="button" class="distance-btn is-active" data-distance="500">500 公尺內</button>
          <button type="button" class="distance-btn" data-distance="1000">1 公里內</button>
          <button type="button" class="distance-btn" data-distance="2000">2 公里內</button>
        </div>

        <!-- 隨機選擇按鈕 -->
        <button id="store-random-btn" class="random-btn">
          <span aria-hidden="true">🎲</span> 隨機選擇
        </button>

        <!-- 隨機選擇結果顯示區塊 -->
        <div id="random-result"></div>
        
        <!-- 菜單 -->
        <section id="menu-section">

        </section>

        <section class="favorite-brands-section">
            <h2>❤️ 我收藏的品牌</h2>

            <div id="favorite-brand-list" class="favorite-brand-list">
                <!-- 收藏的品牌之後會放在這裡 -->
            </div>
        </section>

        
        <!-- store-count 顯示店家數量 -->
        <div id="store-count" class="store-count"></div>

        <!-- store-list 顯示店家列表 -->
        <div id="store-list" class="store-list"></div>

      </section>

        <!-- 店家詳細資訊頁面 -->
        <section id="store-detail-page" class="page">

            <!-- 固定在上面的店家資訊 -->
            <div class="detail-page-sticky">

                <div class="detail-topbar">

                    <button
                        id="back-btn"
                        class="detail-back-btn"
                        type="button"
                        aria-label="返回店家列表"
                    >
                        <span aria-hidden="true">←</span>
                    </button>

                    <h2
                        id="detail-store-name"
                        class="detail-store-name"
                    >
                        店家名稱
                    </h2>

                    <span class="detail-topbar-spacer" aria-hidden="true"></span>

                </div>

                <div id="detail-store-header"></div>

            </div>

            <!-- 可以上下捲動的菜單內容 -->
            <div
                id="detail-store-info"
                class="detail-store-info"
            ></div>

        </section>
    </main>
  </div>

  <!-- 引入 JavaScript 檔案 -->
    <script src="brands.js"></script>
    <script src="stores.js"></script>
    <script src="script.js"></script>

    <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDYGM7-6ehYOdEOgeWt-g6wmrz3Xape6dc&loading=async&libraries=places&callback=initGoogleMaps">
</script>
</body>
</html>
